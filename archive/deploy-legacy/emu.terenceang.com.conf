server {
    listen 80;
    listen [::]:80;
    server_name emu.terenceang.com _;

    root /home/terence/emu;
    index index.html;

    server_tokens off;
    charset utf-8;

    include snippets/emu-security.conf;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ^~ /zx-spectrum/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /apple2e/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        location = /apple2e/healthz {
            access_log off;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            return 204;
        }

        try_files $uri $uri/ =404;
    }

    location = /api/count {
        proxy_pass http://127.0.0.1:8099/count;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        include snippets/emu-security.conf;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        try_files $uri =404;
    }
}
